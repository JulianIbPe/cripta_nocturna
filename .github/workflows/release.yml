# Cada push a main compila el .exe (Windows) y el APK (Android) con la versión 1.0.<número de run>
# y los publica juntos en un Release. Las apps comparan su versión con el último Release y avisan si hay una nueva.
# Secrets necesarios: ANDROID_KEYSTORE_B64 (android/cripta.keystore en base64) y CRIPTA_KS_PASS.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
env:
  VERSION: 1.0.${{ github.run_number }}
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compilar .exe
        working-directory: desktop
        shell: bash
        run: |
          sed "s/const APP_VER='dev'/const APP_VER='$VERSION'/" ../index.html > index.html
          npm pkg set version="$VERSION"
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: desktop/dist/CriptaNocturna.exe

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CRIPTA_KS_PASS: ${{ secrets.CRIPTA_KS_PASS }}
        run: |
          # Sin el keystore de siempre, el APK no se instalaría encima de la versión anterior
          [ -n "$KS_B64" ] || { echo "::error::Falta el secret ANDROID_KEYSTORE_B64"; exit 1; }
          echo "$KS_B64" | base64 -d > android/cripta.keystore
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          sed -i "s/const APP_VER='dev'/const APP_VER='$VERSION'/" index.html
          VERSION_CODE=$(( ${{ github.run_number }} + 1 )) VERSION_NAME=$VERSION bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: CriptaNocturna.apk

  release:
    needs: [exe, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" CriptaNocturna.exe CriptaNocturna.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cripta Nocturna v$VERSION" --generate-notes
